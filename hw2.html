<body>
    <script>
        let arr = [3, 0, 7, 0, 5];

let result = [];
let zeros = 0;

for (let i = 0; i < arr.length; i++) {
    if (arr[i] == 0) {
        zeros++;
    } else {
        result.push(arr[i]);
    }
}

for (let i = 0; i < zeros; i++) {
    result.push(0);
}

console.log(result);


    </script>
</body>
