<body>
    <script>
    let arr = [10, 20, 30, 40, 50];

let first = 0;
let last = arr.length - 1;

while (first < last) {

    
    let temp = arr[first];

    
    arr[first] = arr[last];

    
    arr[last] = temp;

    
    first++;
    last--;
}
console.log(arr);
</script>
</body>
